<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradients & Grid -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#334155" />
    </pattern>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
  </defs>

  <style>
    .title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    .header-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #38bdf8; font-weight: 600; }
    .node-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .node-desc { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    .node-tag { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 600; }
    .conn-label { font-family: ui-monospace, monospace; font-size: 10px; fill: #64748b; font-weight: 500; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />
  <rect width="1200" height="700" fill="url(#circuitGrid)" />

  <!-- Outer HUD Frame -->
  <rect x="25" y="25" width="1150" height="650" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="45" cy="45" r="4" fill="#06b6d4" />
  <circle cx="60" cy="45" r="4" fill="#3b82f6" />
  <circle cx="75" cy="45" r="4" fill="#10b981" />
  <line x1="95" y1="45" x2="320" y2="45" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Section -->
  <text x="350" y="52" class="header-badge" letter-spacing="2">SYSTEM TOPOLOGY // ARSITEKTUR KASIR &amp; INVENTORI</text>
  <text x="45" y="85" class="title" font-size="22">SobatDagang Core Technical Architecture</text>
  <text x="45" y="105" class="subtitle">Desain Arsitektur Sistem Reaktif Terdistribusi, Enkripsi PBKDF2 Web Crypto, dan Virtual Sandbox Storage</text>

  <!-- Status Badges -->
  <g transform="translate(930, 60)">
    <rect width="220" height="34" rx="8" fill="#0f172a" stroke="#334155" />
    <circle cx="20" cy="17" r="4" fill="#10b981" />
    <text x="32" y="21" class="node-tag" fill="#10b981">CLIENT-SIDE SECURE SPA</text>
    <text x="175" y="21" class="node-tag" fill="#64748b">v2.4.0</text>
  </g>

  <!-- ======================== LAYER 1: CLIENT ACCESS & HARDWARE I/O ======================== -->
  <g transform="translate(50, 140)">
    <!-- Zone Box -->
    <rect width="240" height="500" rx="12" fill="#0b1329" fill-opacity="0.7" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4" />
    <rect x="15" y="-12" width="180" height="24" rx="6" fill="#1e293b" stroke="#3b82f6" />
    <text x="25" y="4" class="header-badge" fill="#60a5fa">1. HARDWARE &amp; ACTORS</text>

    <!-- Node: Role Admin -->
    <g transform="translate(15, 25)">
      <rect width="210" height="70" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="70" rx="2" fill="#38bdf8" />
      <circle cx="28" cy="28" r="14" fill="#0284c7" fill-opacity="0.3" />
      <text x="23" y="33" font-size="14">👑</text>
      <text x="52" y="27" class="node-title">Administrator</text>
      <text x="52" y="44" class="node-desc">Akses Penuh: Finansial, Stok,</text>
      <text x="52" y="58" class="node-desc">Audit Pengguna &amp; Backup</text>
    </g>

    <!-- Node: Role Kasir -->
    <g transform="translate(15, 110)">
      <rect width="210" height="70" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="70" rx="2" fill="#10b981" />
      <circle cx="28" cy="28" r="14" fill="#059669" fill-opacity="0.3" />
      <text x="23" y="33" font-size="14">👨‍💼</text>
      <text x="52" y="27" class="node-title">Kasir (Cashier)</text>
      <text x="52" y="44" class="node-desc">POS Checkout, Hold Cart,</text>
      <text x="52" y="58" class="node-desc">Struk &amp; Rekap Tutup Shift</text>
    </g>

    <!-- Node: Barcode Scanner -->
    <g transform="translate(15, 205)">
      <rect width="210" height="75" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="75" rx="2" fill="#f59e0b" />
      <text x="18" y="25" class="node-title">📡 Barcode Scanner I/O</text>
      <text x="18" y="42" class="node-desc">Keyboard Wedge Handler (/)</text>
      <text x="18" y="56" class="node-desc">Auto-SKU Matching &amp; Enter</text>
      <rect x="18" y="60" width="105" height="12" rx="3" fill="#f59e0b" fill-opacity="0.2" />
      <text x="22" y="69" class="node-tag" fill="#fbbf24">ZERO-LATENCY INPUT</text>
    </g>

    <!-- Node: Thermal Printer Spooler -->
    <g transform="translate(15, 300)">
      <rect width="210" height="75" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="75" rx="2" fill="#8b5cf6" />
      <text x="18" y="25" class="node-title">🖨️ Thermal Print Engine</text>
      <text x="18" y="42" class="node-desc">58mm / 80mm ESC/POS Layout</text>
      <text x="18" y="56" class="node-desc">Window Print CSS Media Query</text>
      <rect x="18" y="60" width="85" height="12" rx="3" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="22" y="69" class="node-tag" fill="#c084fc">AUTO-FORMAT</text>
    </g>

    <!-- Node: CSV Data Export -->
    <g transform="translate(15, 395)">
      <rect width="210" height="75" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="75" rx="2" fill="#06b6d4" />
      <text x="18" y="25" class="node-title">📊 CSV Export Engine</text>
      <text x="18" y="42" class="node-desc">Blob Data Serialization</text>
      <text x="18" y="56" class="node-desc">Rekap Laporan &amp; Data Stok</text>
      <rect x="18" y="60" width="95" height="12" rx="3" fill="#06b6d4" fill-opacity="0.2" />
      <text x="22" y="69" class="node-tag" fill="#67e8f9">CLIENT DOWNLOAD</text>
    </g>
  </g>

  <!-- ======================== LAYER 2: CORE REACT ORCHESTRATOR ======================== -->
  <g transform="translate(330, 140)">
    <rect width="320" height="500" rx="12" fill="#0b1329" fill-opacity="0.7" stroke="#0284c7" stroke-width="1" stroke-dasharray="4 4" />
    <rect x="15" y="-12" width="220" height="24" rx="6" fill="#1e293b" stroke="#0284c7" />
    <text x="25" y="4" class="header-badge" fill="#38bdf8">2. REACT 19 STATE ENGINE</text>

    <!-- App.tsx Core -->
    <g transform="translate(15, 20)">
      <rect width="290" height="85" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
      <text x="16" y="26" class="node-title" fill="#38bdf8">⚡ State Orchestrator (App.tsx)</text>
      <text x="16" y="44" class="node-desc">• products[] • cart[] • transactions[]</text>
      <text x="16" y="58" class="node-desc">• heldCarts[] • currentUser • isPracticeMode</text>
      <text x="16" y="72" class="node-desc">• toasts[] • activeView Router</text>
    </g>

    <!-- Submodule: POS Terminal Machine -->
    <g transform="translate(15, 120)">
      <rect width="290" height="80" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#10b981" />
      <text x="16" y="24" class="node-title">🛒 POS Checkout Pipeline</text>
      <text x="16" y="40" class="node-desc">Barcode Catch → Price Calc → Discount</text>
      <text x="16" y="54" class="node-desc">Hold Cart Queue (F2) → Tender Validation</text>
      <text x="16" y="68" class="node-desc">Quick Cash Denominations + Count-Up FX</text>
    </g>

    <!-- Submodule: Inventory & Alert Engine -->
    <g transform="translate(15, 215)">
      <rect width="290" height="80" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#f59e0b" />
      <text x="16" y="24" class="node-title">📦 Inventory &amp; SKU Core</text>
      <text x="16" y="40" class="node-desc">Stock Thresholds: Aman / Menipis / Habis</text>
      <text x="16" y="54" class="node-desc">Inline Quick +/- Adjuster with Undo Buffer</text>
      <text x="16" y="68" class="node-desc">Margin Calc (Modal vs Jual) + Auto Draft</text>
    </g>

    <!-- Submodule: Analytics & Recharts -->
    <g transform="translate(15, 310)">
      <rect width="290" height="80" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="80" rx="2" fill="#8b5cf6" />
      <text x="16" y="24" class="node-title">📊 Finansial &amp; Analytics Engine</text>
      <text x="16" y="40" class="node-desc">KPI: Omzet, Trx, Laba Bersih, AOV</text>
      <text x="16" y="54" class="node-desc">Recharts Daily Trends &amp; QRIS vs Tunai</text>
      <text x="16" y="68" class="node-desc">Kasir Shift Summary (Z-Report Pre-close)</text>
    </g>

    <!-- Submodule: Command Palette & Hotkeys -->
    <g transform="translate(15, 405)">
      <rect width="290" height="75" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="75" rx="2" fill="#ec4899" />
      <text x="16" y="24" class="node-title">⌨️ Command Palette (Ctrl+K)</text>
      <text x="16" y="40" class="node-desc">Global Keyboard Dispatcher</text>
      <text x="16" y="54" class="node-desc">Fuzzy Search Navigation across all Views</text>
      <text x="16" y="68" class="node-desc">Hotkeys: /, F2, Ctrl+Enter, Esc, Shift+?</text>
    </g>
  </g>

  <!-- ======================== LAYER 3: SECURITY & ONBOARDING ======================== -->
  <g transform="translate(690, 140)">
    <rect width="220" height="500" rx="12" fill="#0b1329" fill-opacity="0.7" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 4" />
    <rect x="15" y="-12" width="180" height="24" rx="6" fill="#1e293b" stroke="#7c3aed" />
    <text x="25" y="4" class="header-badge" fill="#c084fc">3. SECURITY &amp; TOUR</text>

    <!-- Web Crypto Gateway -->
    <g transform="translate(15, 20)">
      <rect width="190" height="135" rx="8" fill="url(#blueCard)" stroke="#7c3aed" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="135" rx="2" fill="#a855f7" />
      <text x="14" y="24" class="node-title">🔐 PBKDF2 Web Crypto</text>
      <text x="14" y="42" class="node-desc">• Native SubtleCrypto API</text>
      <text x="14" y="58" class="node-desc">• SHA-256 HMAC digest</text>
      <text x="14" y="74" class="node-desc">• 100,000 salt iterations</text>
      <text x="14" y="90" class="node-desc">• Force Password Reset</text>
      <text x="14" y="106" class="node-desc">• Last-Admin Safety Lock</text>
      <rect x="14" y="113" width="90" height="13" rx="3" fill="#a855f7" fill-opacity="0.2" />
      <text x="18" y="123" class="node-tag" fill="#d8b4fe">ZERO PLAINTEXT</text>
    </g>

    <!-- Onboarding Suite -->
    <g transform="translate(15, 175)">
      <rect width="190" height="145" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="145" rx="2" fill="#06b6d4" />
      <text x="14" y="24" class="node-title">🎓 Onboarding Engine</text>
      <text x="14" y="42" class="node-desc">• GuidedTour (SVG Mask)</text>
      <text x="14" y="58" class="node-desc">• Dynamic Spotlight Cutout</text>
      <text x="14" y="74" class="node-desc">• Floating Checklist Widget</text>
      <text x="14" y="90" class="node-desc">• Real Event Triggering</text>
      <text x="14" y="106" class="node-desc">• Help Drawer Accordion</text>
      <rect x="14" y="118" width="105" height="14" rx="3" fill="#06b6d4" fill-opacity="0.2" />
      <text x="18" y="129" class="node-tag" fill="#67e8f9">INTERACTIVE FLOW</text>
    </g>

    <!-- RBAC Gatekeeper -->
    <g transform="translate(15, 340)">
      <rect width="190" height="135" rx="8" fill="url(#blueCard)" stroke="#334155" />
      <rect x="0" y="0" width="4" height="135" rx="2" fill="#10b981" />
      <text x="14" y="24" class="node-title">🛡️ RBAC Guard Matrix</text>
      <text x="14" y="42" class="node-desc">• View Access Boundary</text>
      <text x="14" y="58" class="node-desc">• Kasir: Struk, Shift, POS</text>
      <text x="14" y="74" class="node-desc">• Admin: Full Audit, Users</text>
      <text x="14" y="90" class="node-desc">• Zero-leak Kasir View</text>
      <rect x="14" y="105" width="100" height="14" rx="3" fill="#10b981" fill-opacity="0.2" />
      <text x="18" y="116" class="node-tag" fill="#34d399">ISOLATED SCOPES</text>
    </g>
  </g>

  <!-- ======================== LAYER 4: STORAGE & SANDBOX ======================== -->
  <g transform="translate(950, 140)">
    <rect width="200" height="500" rx="12" fill="#0b1329" fill-opacity="0.7" stroke="#059669" stroke-width="1" stroke-dasharray="4 4" />
    <rect x="15" y="-12" width="170" height="24" rx="6" fill="#1e293b" stroke="#059669" />
    <text x="25" y="4" class="header-badge" fill="#34d399">4. STORAGE ROUTER</text>

    <!-- Sandbox Switcher Router -->
    <g transform="translate(15, 30)">
      <polygon points="85,0 170,45 85,90 0,45" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="48" y="42" class="node-title" font-size="11" fill="#fbbf24">Practice Mode?</text>
      <text x="60" y="56" class="node-desc" font-size="9">(Toggle)</text>
    </g>

    <!-- Branch YES: In-Memory Sandbox -->
    <g transform="translate(15, 160)">
      <rect width="170" height="120" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="25" cy="25" r="10" fill="#f59e0b" fill-opacity="0.3" />
      <text x="20" y="29" font-size="11">🧪</text>
      <text x="42" y="27" class="node-title" fill="#fbbf24">Practice Sandbox</text>
      <text x="14" y="52" class="node-desc">• Ephemeral RAM state</text>
      <text x="14" y="68" class="node-desc">• No LocalStorage writes</text>
      <text x="14" y="84" class="node-desc">• Safe trial for trainees</text>
      <text x="14" y="100" class="node-desc">• 1-click restore real data</text>
    </g>

    <!-- Branch NO: Production LocalStorage -->
    <g transform="translate(15, 320)">
      <rect width="170" height="150" rx="8" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.5" />
      <circle cx="25" cy="25" r="10" fill="#10b981" fill-opacity="0.3" />
      <text x="20" y="29" font-size="11">🗄️</text>
      <text x="42" y="27" class="node-title" fill="#34d399">Local Persistence</text>
      <text x="14" y="52" class="node-desc">• products_v2</text>
      <text x="14" y="68" class="node-desc">• transactions_v2</text>
      <text x="14" y="84" class="node-desc">• auth_users_v2</text>
      <text x="14" y="100" class="node-desc">• active_held_carts</text>
      <text x="14" y="116" class="node-desc">• onboarding_progress</text>
      <rect x="14" y="126" width="125" height="14" rx="3" fill="#10b981" fill-opacity="0.2" />
      <text x="18" y="137" class="node-tag" fill="#6ee7b7">PERSISTENT CACHE</text>
    </g>
  </g>

  <!-- ======================== CONNECTION PATHWAYS & DATA BUS ======================== -->
  <!-- Layer 1 to Layer 2 -->
  <path d="M 275 235 L 330 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 275 320 L 330 250" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowCyan)" />
  <path d="M 330 270 L 275 385" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)" />
  <path d="M 330 350 L 275 480" fill="none" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)" />

  <!-- Layer 2 to Layer 3 -->
  <path d="M 650 200 L 690 200" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />
  <path d="M 650 300 L 690 300" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)" />
  <path d="M 650 400 L 690 440" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)" />

  <!-- Layer 2 to Layer 4 (Through Router) -->
  <path d="M 650 180 Q 780 120 950 215" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Router Branches -->
  <path d="M 1035 240 L 1035 290" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
  <text x="1045" y="270" class="conn-label" fill="#fbbf24">Ya (Sandbox)</text>

  <path d="M 1035 240 Q 1035 290 1035 450" fill="none" stroke="#10b981" stroke-width="2" />
  <text x="1045" y="380" class="conn-label" fill="#34d399">Tidak (Real)</text>

</svg>
