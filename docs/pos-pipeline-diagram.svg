<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="emeraldArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    .badge { font-family: ui-monospace, monospace; font-size: 11px; fill: #10b981; font-weight: 600; }
    .step-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .step-desc { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; line-height: 1.4; }
    .code-tag { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1200" height="620" fill="url(#bgGrad2)" />
  <rect width="1200" height="620" fill="url(#dotGrid)" />

  <!-- Outer HUD Frame -->
  <rect x="25" y="25" width="1150" height="570" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Header -->
  <text x="45" y="60" class="badge" letter-spacing="2">PIPELINE TRANSAKSI KASIR // TRANSACTION STATE MACHINE</text>
  <text x="45" y="90" class="title" font-size="22">POS High-Throughput Checkout Pipeline</text>
  <text x="45" y="110" class="subtitle">Alur Pemrosesan Nota Penjualan, Manajemen Antrean Hold Cart, Kalkulasi Uang Cepat, &amp; Penyesuaian Stok Atomik</text>

  <!-- ======================== STEP 1: SCAN & INPUT ======================== -->
  <g transform="translate(45, 140)">
    <rect width="200" height="420" rx="12" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="15" y="-10" width="130" height="20" rx="5" fill="#0284c7" />
    <text x="25" y="4" class="code-tag" fill="#ffffff">STEP 01: CAPTURE</text>

    <text x="20" y="40" class="step-title">Barcode &amp; Search</text>
    <text x="20" y="60" class="step-desc">Tangkapan input keyboard</text>
    <text x="20" y="75" class="step-desc">wedge USB / scan fisik</text>

    <!-- Sub-elements -->
    <g transform="translate(15, 100)">
      <rect width="170" height="55" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#38bdf8">Shortcut Key: [/]</text>
      <text x="12" y="38" class="step-desc">Auto-focus global input</text>
    </g>

    <g transform="translate(15, 170)">
      <rect width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#38bdf8">Exact SKU Match</text>
      <text x="12" y="38" class="step-desc">Enter otomatis menambah</text>
      <text x="12" y="52" class="step-desc">kuantitas item keranjang</text>
    </g>

    <g transform="translate(15, 250)">
      <rect width="170" height="70" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#38bdf8">Kategori Chip</text>
      <text x="12" y="38" class="step-desc">Filter instan Sembako,</text>
      <text x="12" y="52" class="step-desc">Minuman, Bumbu, dll.</text>
    </g>

    <g transform="translate(15, 340)">
      <rect width="170" height="60" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" />
      <text x="12" y="24" class="code-tag" fill="#7dd3fc">Fly-to-Cart Animation</text>
      <text x="12" y="42" class="step-desc">Micro-feedback visual</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 245 350 L 275 350" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- ======================== STEP 2: CART ORCHESTRATION ======================== -->
  <g transform="translate(275, 140)">
    <rect width="200" height="420" rx="12" fill="url(#cardGrad2)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="15" y="-10" width="130" height="20" rx="5" fill="#d97706" />
    <text x="25" y="4" class="code-tag" fill="#ffffff">STEP 02: BUFFER</text>

    <text x="20" y="40" class="step-title">Cart &amp; Queue</text>
    <text x="20" y="60" class="step-desc">Manipulasi keranjang &amp;</text>
    <text x="20" y="75" class="step-desc">manajemen antrean kasir</text>

    <!-- Sub-elements -->
    <g transform="translate(15, 100)">
      <rect width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#fbbf24">Hold Cart (F2)</text>
      <text x="12" y="38" class="step-desc">Simpan sementara antrean</text>
      <text x="12" y="52" class="step-desc">pembeli tanpa data hilang</text>
    </g>

    <g transform="translate(15, 180)">
      <rect width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#fbbf24">Hold-to-Repeat Stepper</text>
      <text x="12" y="38" class="step-desc">Penyesuaian qty cepat</text>
      <text x="12" y="52" class="step-desc">dengan akselerasi tap</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#fbbf24">Undo Delete (5 Detik)</text>
      <text x="12" y="38" class="step-desc">Proteksi salah geser item</text>
      <text x="12" y="52" class="step-desc">dengan toast pemulihan</text>
    </g>

    <g transform="translate(15, 340)">
      <rect width="170" height="60" rx="6" fill="#d97706" fill-opacity="0.15" stroke="#d97706" />
      <text x="12" y="24" class="code-tag" fill="#fde68a">Notes &amp; Catatan</text>
      <text x="12" y="42" class="step-desc">Keterangan khusus per item</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 475 350 L 505 350" stroke="#f59e0b" stroke-width="2" marker-end="url(#amberArrow)" />

  <!-- ======================== STEP 3: PAYMENT RESOLVER ======================== -->
  <g transform="translate(505, 140)">
    <rect width="200" height="420" rx="12" fill="url(#cardGrad2)" stroke="#a855f7" stroke-width="1.5" />
    <rect x="15" y="-10" width="130" height="20" rx="5" fill="#7c3aed" />
    <text x="25" y="4" class="code-tag" fill="#ffffff">STEP 03: TENDER</text>

    <text x="20" y="40" class="step-title">Payment Engine</text>
    <text x="20" y="60" class="step-desc">Kalkulator pecahan uang &amp;</text>
    <text x="20" y="75" class="step-desc">verifikasi multi-metode</text>

    <!-- Sub-elements -->
    <g transform="translate(15, 100)">
      <rect width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#c084fc">Shortcut: Ctrl+Enter</text>
      <text x="12" y="38" class="step-desc">Langsung buka modal bayar</text>
      <text x="12" y="52" class="step-desc">tanpa menyentuh mouse</text>
    </g>

    <g transform="translate(15, 180)">
      <rect width="170" height="75" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#c084fc">Quick Cash Buttons</text>
      <text x="12" y="38" class="step-desc">• Uang Pas</text>
      <text x="12" y="52" class="step-desc">• Pembulatan Rp 10k, 20k,</text>
      <text x="12" y="66" class="step-desc">  50k, 100k di atas total</text>
    </g>

    <g transform="translate(15, 270)">
      <rect width="170" height="60" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#c084fc">QRIS Dinamis</text>
      <text x="12" y="38" class="step-desc">Panduan cek mutasi manual</text>
    </g>

    <g transform="translate(15, 345)">
      <rect width="170" height="55" rx="6" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" />
      <text x="12" y="22" class="code-tag" fill="#e9d5ff">Count-Up Animation</text>
      <text x="12" y="40" class="step-desc">Kembalian berhitung mulus</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 705 350 L 735 350" stroke="#a855f7" stroke-width="2" marker-end="url(#flowArrow)" />

  <!-- ======================== STEP 4: ATOMIC COMMIT ======================== -->
  <g transform="translate(735, 140)">
    <rect width="200" height="420" rx="12" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="-10" width="130" height="20" rx="5" fill="#059669" />
    <text x="25" y="4" class="code-tag" fill="#ffffff">STEP 04: SETTLE</text>

    <text x="20" y="40" class="step-title">Atomic Commit</text>
    <text x="20" y="60" class="step-desc">Pemotongan stok barang &amp;</text>
    <text x="20" y="75" class="step-desc">pencatatan invoice riil</text>

    <!-- Sub-elements -->
    <g transform="translate(15, 100)">
      <rect width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#34d399">Stock Deduction</text>
      <text x="12" y="38" class="step-desc">Stok produk dikurangi</text>
      <text x="12" y="52" class="step-desc">secara sinkron &amp; valid</text>
    </g>

    <g transform="translate(15, 180)">
      <rect width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#34d399">Invoice Generation</text>
      <text x="12" y="38" class="step-desc">Nomor unik INV-TIMESTAMP</text>
      <text x="12" y="52" class="step-desc">dengan metadata kasir</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="170" height="65" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#34d399">Onboarding Dispatch</text>
      <text x="12" y="38" class="step-desc">Kirim event complete_sale</text>
      <text x="12" y="52" class="step-desc">ke checklist onboarding</text>
    </g>

    <g transform="translate(15, 340)">
      <rect width="170" height="60" rx="6" fill="#059669" fill-opacity="0.15" stroke="#059669" />
      <text x="12" y="24" class="code-tag" fill="#a7f3d0">Sandbox Filter</text>
      <text x="12" y="42" class="step-desc">Isolasi jika Practice Mode</text>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 935 350 L 965 350" stroke="#10b981" stroke-width="2" marker-end="url(#emeraldArrow)" />

  <!-- ======================== STEP 5: OUTPUT & RECEIPT ======================== -->
  <g transform="translate(965, 140)">
    <rect width="190" height="420" rx="12" fill="url(#cardGrad2)" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="15" y="-10" width="130" height="20" rx="5" fill="#0891b2" />
    <text x="25" y="4" class="code-tag" fill="#ffffff">STEP 05: OUTPUT</text>

    <text x="20" y="40" class="step-title">Receipt &amp; Reset</text>
    <text x="20" y="60" class="step-desc">Cetak struk pelanggan &amp;</text>
    <text x="20" y="75" class="step-desc">siap transaksi berikutnya</text>

    <!-- Sub-elements -->
    <g transform="translate(15, 100)">
      <rect width="160" height="70" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#67e8f9">Thermal Print</text>
      <text x="12" y="38" class="step-desc">Format khusus kertas</text>
      <text x="12" y="52" class="step-desc">58mm &amp; 80mm kasir</text>
    </g>

    <g transform="translate(15, 185)">
      <rect width="160" height="70" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#67e8f9">Riwayat Saya Shift</text>
      <text x="12" y="38" class="step-desc">Tercatat di log shift</text>
      <text x="12" y="52" class="step-desc">kasir untuk tutup buku</text>
    </g>

    <g transform="translate(15, 270)">
      <rect width="160" height="60" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="22" class="code-tag" fill="#67e8f9">Auto Clear Cart</text>
      <text x="12" y="38" class="step-desc">Reset status keranjang</text>
    </g>

    <g transform="translate(15, 345)">
      <rect width="160" height="55" rx="6" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" />
      <text x="12" y="22" class="code-tag" fill="#a5f3fc">Ready for Next Customer</text>
      <text x="12" y="40" class="step-desc">Fokus kembali ke [/]</text>
    </g>
  </g>

</svg>
