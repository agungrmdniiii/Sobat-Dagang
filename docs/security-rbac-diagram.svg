<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <linearGradient id="cardSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <marker id="purpleArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="emeraldArrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>

    <pattern id="secGrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#1f2937" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
    .sec-badge { font-family: ui-monospace, monospace; font-size: 11px; fill: #c084fc; font-weight: 600; }
    .node-title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .node-desc { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    .code-tag { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1200" height="620" fill="url(#bgSec)" />
  <rect width="1200" height="620" fill="url(#secGrid)" />

  <!-- Frame -->
  <rect x="25" y="25" width="1150" height="570" rx="16" fill="none" stroke="#374151" stroke-width="1.5" />
  
  <!-- Header -->
  <text x="45" y="60" class="sec-badge" letter-spacing="2">CRYPTOGRAPHY &amp; ACCESS CONTROL // KEAMANAN &amp; HAK AKSES</text>
  <text x="45" y="90" class="title" font-size="22">Web Crypto PBKDF2 &amp; Role-Based Access Control</text>
  <text x="45" y="110" class="subtitle">Enkripsi Satu Arah Standar Industri Tanpa Plaintext, Gateway Reset Sandi Wajib, &amp; Partisi Hak Akses Kasir/Admin</text>

  <!-- ======================== SECTION 1: CRYPTOGRAPHIC PIPELINE ======================== -->
  <g transform="translate(45, 140)">
    <rect width="530" height="420" rx="12" fill="url(#cardSec)" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="15" y="-10" width="220" height="20" rx="5" fill="#6d28d9" />
    <text x="25" y="4" class="code-tag" fill="#ffffff">MODULE 01: WEB CRYPTO ENGINE</text>

    <text x="25" y="40" class="node-title" font-size="15">Algoritma Enkripsi &amp; Derivasi Kunci PBKDF2</text>
    <text x="25" y="58" class="node-desc">Menggunakan SubtleCrypto API native browser (W3C Recommendation)</text>

    <!-- Flow Steps -->
    <g transform="translate(25, 80)">
      <!-- Step A -->
      <rect width="210" height="85" rx="8" fill="#111827" stroke="#374151" />
      <text x="14" y="24" class="node-title" fill="#a78bfa">Input Plain Password</text>
      <text x="14" y="42" class="node-desc">• Input teks dari form login</text>
      <text x="14" y="58" class="node-desc">• Evaluasi kekuatan (Score 0-4)</text>
      <text x="14" y="72" class="node-desc">• UTF-8 TextEncoder bytes</text>
    </g>

    <path d="M 235 122 L 270 122" stroke="#8b5cf6" stroke-width="2" marker-end="url(#purpleArrow)" />

    <g transform="translate(280, 80)">
      <!-- Step B -->
      <rect width="225" height="85" rx="8" fill="#111827" stroke="#374151" />
      <text x="14" y="24" class="node-title" fill="#a78bfa">Salt Generation</text>
      <text x="14" y="42" class="node-desc">• crypto.getRandomValues()</text>
      <text x="14" y="58" class="node-desc">• 16 bytes Cryptographic Salt</text>
      <text x="14" y="72" class="node-desc">• Mencegah Rainbow Table Attack</text>
    </g>

    <!-- Arrow down -->
    <path d="M 392 165 L 392 195" stroke="#8b5cf6" stroke-width="2" marker-end="url(#purpleArrow)" />

    <!-- Step C: PBKDF2 Engine -->
    <g transform="translate(25, 205)">
      <rect width="480" height="95" rx="8" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5" />
      <text x="16" y="26" class="node-title" fill="#c4b5fd">⚙️ crypto.subtle.deriveBits (PBKDF2 Engine)</text>
      <text x="16" y="46" class="node-desc">• Hash Digest: SHA-256 (256-bit security level)</text>
      <text x="16" y="62" class="node-desc">• Iteration Count: 100.000 rounds (memperlambat brute-force tanpa lag UI)</text>
      <text x="16" y="78" class="node-desc">• Derived Key Length: 256 bits (32 bytes hash)</text>
    </g>

    <!-- Arrow down -->
    <path d="M 265 300 L 265 325" stroke="#8b5cf6" stroke-width="2" marker-end="url(#purpleArrow)" />

    <!-- Step D: Hash Format Output -->
    <g transform="translate(25, 335)">
      <rect width="480" height="65" rx="8" fill="#111827" stroke="#10b981" />
      <text x="16" y="24" class="node-title" fill="#34d399">Tersimpan Aman di Database:</text>
      <text x="16" y="44" class="code-tag" fill="#6ee7b7">Format: "hex_salt : hex_pbkdf2_derived_hash"</text>
      <text x="16" y="58" class="node-desc">Kata sandi asli langsung dimusnahkan dari memory stack browser.</text>
    </g>
  </g>

  <!-- ======================== SECTION 2: RBAC MATRIX & VIEW GUARD ======================== -->
  <g transform="translate(615, 140)">
    <rect width="540" height="420" rx="12" fill="url(#cardSec)" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="15" y="-10" width="220" height="20" rx="5" fill="#0284c7" />
    <text x="25" y="4" class="code-tag" fill="#ffffff">MODULE 02: RBAC PERMISSIONS</text>

    <text x="25" y="40" class="node-title" font-size="15">Matriks Hak Akses &amp; Partisi Tampilan</text>
    <text x="25" y="58" class="node-desc">Enforcement otomatis pada Sidebar, Router, dan Aksi Tombol</text>

    <!-- Table of Permissions -->
    <g transform="translate(25, 75)">
      <rect width="490" height="150" rx="8" fill="#0f172a" stroke="#334155" />
      
      <!-- Header Row -->
      <rect width="490" height="30" rx="8" fill="#1e293b" />
      <text x="15" y="20" class="code-tag" fill="#94a3b8">MODUL SISTEM</text>
      <text x="220" y="20" class="code-tag" fill="#38bdf8">ADMIN (OWNER)</text>
      <text x="370" y="20" class="code-tag" fill="#10b981">KASIR (STAFF)</text>

      <!-- Row 1 -->
      <text x="15" y="50" class="node-desc" font-weight="600">POS Kasir &amp; Keranjang</text>
      <text x="240" y="50" class="code-tag" fill="#38bdf8">✅ AKSES</text>
      <text x="390" y="50" class="code-tag" fill="#10b981">✅ AKSES</text>

      <!-- Row 2 -->
      <text x="15" y="75" class="node-desc" font-weight="600">Riwayat Saya (Shift Kasir)</text>
      <text x="240" y="75" class="code-tag" fill="#38bdf8">✅ AKSES</text>
      <text x="390" y="75" class="code-tag" fill="#10b981">✅ AKSES</text>

      <!-- Row 3 -->
      <text x="15" y="100" class="node-desc" font-weight="600">Katalog &amp; Edit Stok Inventori</text>
      <text x="240" y="100" class="code-tag" fill="#38bdf8">✅ AKSES PENUH</text>
      <text x="390" y="100" class="code-tag" fill="#ef4444">❌ DIBLOKIR</text>

      <!-- Row 4 -->
      <text x="15" y="125" class="node-desc" font-weight="600">Laporan Omzet, Laba &amp; AOV</text>
      <text x="240" y="125" class="code-tag" fill="#38bdf8">✅ AKSES PENUH</text>
      <text x="390" y="125" class="code-tag" fill="#ef4444">❌ DIBLOKIR</text>

      <!-- Row 5 -->
      <text x="15" y="145" class="node-desc" font-weight="600">Kelola Akun, Role &amp; Reset</text>
      <text x="240" y="145" class="code-tag" fill="#38bdf8">✅ AKSES PENUH</text>
      <text x="390" y="145" class="code-tag" fill="#ef4444">❌ DIBLOKIR</text>
    </g>

    <!-- Sub-boxes: Safety Guarantees -->
    <g transform="translate(25, 240)">
      <!-- Left box -->
      <rect width="235" height="150" rx="8" fill="#111827" stroke="#f59e0b" />
      <text x="14" y="24" class="node-title" fill="#fbbf24">🔑 Force Password Reset</text>
      <text x="14" y="44" class="node-desc">Jika `mustChangePassword: true`:</text>
      <text x="14" y="60" class="node-desc">• Layar terkunci di modal wajib</text>
      <text x="14" y="76" class="node-desc">• Menu &amp; data toko ditutup</text>
      <text x="14" y="92" class="node-desc">• Wajib buat sandi baru valid</text>
      <text x="14" y="108" class="node-desc">• Flag reset dihapus otomatis</text>
      <rect x="14" y="120" width="115" height="15" rx="3" fill="#f59e0b" fill-opacity="0.2" />
      <text x="18" y="131" class="code-tag" fill="#fde68a">STAFF SECURITY</text>
    </g>

    <g transform="translate(280, 240)">
      <!-- Right box -->
      <rect width="235" height="150" rx="8" fill="#111827" stroke="#ef4444" />
      <text x="14" y="24" class="node-title" fill="#f87171">🛡️ Last-Admin Safety Lock</text>
      <text x="14" y="44" class="node-desc">Proteksi anti-lockout sistem:</text>
      <text x="14" y="60" class="node-desc">• Larang hapus akun sendiri</text>
      <text x="14" y="76" class="node-desc">  jika merupakan admin tunggal</text>
      <text x="14" y="92" class="node-desc">• Larang penurunan role admin</text>
      <text x="14" y="108" class="node-desc">• Sistem selalu memiliki admin</text>
      <rect x="14" y="120" width="125" height="15" rx="3" fill="#ef4444" fill-opacity="0.2" />
      <text x="18" y="131" class="code-tag" fill="#fca5a5">ANTI LOCKOUT GUARD</text>
    </g>
  </g>

</svg>
